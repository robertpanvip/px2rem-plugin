pluginGroup=com.github.reactunitconverter
pluginName=ReactUnitConverter
pluginVersion=1.0.0

platformType=IU
platformVersion=2023.2
platformDownloadSources=true

javaVersion=17
gradleVersion=8.14.5

kotlinCodeStyle=official

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.home=/tmp/tools/jdk-17

# ---------- 代理配置：本机 127.0.0.1:18080（GRADLE 不读 HTTP_PROXY 环境变量，需要 systemProp） ----------
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local
